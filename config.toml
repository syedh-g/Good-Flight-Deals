[deals]
# A fare is a deal when it's unusually cheap *for its route*. Each route's normal price and
# normal day-to-day swing are learned from its own history; see src/flight_deals/deals.py.
#
# How unusual: number of "normal swings" below typical. 2 is roughly the cheapest 1 day in 40.
min_zscore = 2.0
# And worth caring about: the saving against the typical price must be at least this big.
min_saving_pct = 12
# Days of history needed before a route's typical price is trusted.
min_history_days = 7
# Treat every route as swinging by at least this much, so a route stuck at one price for
# weeks doesn't flag a £1 dip.
min_spread_pct = 5
# How far back the typical price looks.
history_days = 60
# Don't re-alert the same destination within this window unless the price drops further.
alert_cooldown_days = 14

[budget]
# Hard stop on API calls per calendar month (SerpApi free tier is 250).
monthly_search_limit = 240

[storage]
# Relative paths resolve against this file's directory.
db_path = "data/flight_deals.db"
