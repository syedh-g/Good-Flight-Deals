# Flight-deal finder settings. Secrets live in .env, not here.

[search]
# IATA codes of the airports you're happy to fly from.
origins = ["LHR", "LGW", "STN", "LTN", "BHX", "MAN"]
currency = "GBP"

# Each [[searches]] block is one API call per run, so keep
# (number of searches) x 31 under monthly_search_limit below.
#
#   region          europe | asia (incl. Middle East) | north_america | south_america
#                   | africa | caribbean. Omit to let Google pick nearby places.
#   trip_length     weekend | one_week | two_weeks
#   max_stops       0 = direct only, 1 = up to one stop, 2 = up to two. Omit for any.
#   min_flight_hours / max_flight_hours
#                   One-way journey time including layovers. Both optional.
#   max_price       Always alert at or below this price, whatever the history. Optional.
#
# The name labels price history, so renaming a search starts its history afresh.

[[searches]]
name = "europe"
region = "europe"
trip_length = "one_week"
max_stops = 1
max_price = 30

[[searches]]
name = "asia"
region = "asia"
trip_length = "two_weeks"
max_stops = 1
min_flight_hours = 4
max_flight_hours = 24

[[searches]]
name = "africa"
region = "africa"
trip_length = "two_weeks"
max_stops = 1
min_flight_hours = 4
max_flight_hours = 24

# More long-haul regions. Each one adds ~31 searches a month.
